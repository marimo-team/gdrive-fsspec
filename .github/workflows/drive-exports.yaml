name: Drive export checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GDRIVE_FSSPEC_REQUIRE_EXPORT_CHECKS: "1"

jobs:
  catalog:
    name: Export catalog changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: env1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Compare the live API catalog with the reviewed snapshot
        env:
          GDRIVE_FSSPEC_CREDENTIALS_PATH: ${{ secrets.GDRIVE_FSSPEC_CREDENTIALS_PATH }}
        run: uv run pytest -vv -m integration tests/test_export_integration.py -k export_catalog

  public-exports:
    name: Public export content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Validate every public export format
        env:
          GDRIVE_FSSPEC_PUBLIC_DOCUMENT: ${{ vars.GDRIVE_FSSPEC_PUBLIC_DOCUMENT }}
          GDRIVE_FSSPEC_PUBLIC_SPREADSHEETS: ${{ vars.GDRIVE_FSSPEC_PUBLIC_SPREADSHEETS }}
          GDRIVE_FSSPEC_PUBLIC_PRESENTATION: ${{ vars.GDRIVE_FSSPEC_PUBLIC_PRESENTATION }}
          GDRIVE_FSSPEC_PUBLIC_DRAWINGS: ${{ vars.GDRIVE_FSSPEC_PUBLIC_DRAWINGS }}
        run: uv run pytest -vv -m integration tests/test_export_integration.py -k public_export
