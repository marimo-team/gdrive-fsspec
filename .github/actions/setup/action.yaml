name: Setup
description: Install uv and sync the project environment

inputs:
  python-version:
    description: Python version for uv to install (defaults to uv's own default)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install latest uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-groups
